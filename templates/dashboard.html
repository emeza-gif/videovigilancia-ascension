<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Centro de Videovigilancia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
    .navbar { background-color: #002b7f; }
    .navbar-brand, .nav-link { color: #fff !important; }
    .card { border: none; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card-title { color: #002b7f; font-weight: 600; }
    .metric { font-size: 1.8rem; font-weight: bold; color: #002b7f; }
    .subtext { color: #6c757d; font-size: 0.9rem; }
  </style>
</head>
<body>
  <!-- Barra superior -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Centro de Videovigilancia</a>
    </div>
  </nav>

  <div class="container py-4">
    <h3 class="text-center mb-4">📊 Dashboard Ejecutivo</h3>

    <!-- Métricas principales -->
    <div class="row text-center mb-4">
      <div class="col-md-3 col-6 mb-3">
        <div class="card p-3">
          <div class="metric">{{ total_encuestas }}</div>
          <div class="subtext">Encuestas Totales</div>
        </div>
      </div>
      <div class="col-md-3 col-6 mb-3">
        <div class="card p-3">
          <div class="metric">{{ promedio|round(2) }}</div>
          <div class="subtext">Satisfacción General</div>
        </div>
      </div>
      <div class="col-md-3 col-6 mb-3">
        <div class="card p-3">
          <div class="metric">7 min</div>
          <div class="subtext">Tiempo Promedio</div>
        </div>
      </div>
      <div class="col-md-3 col-6 mb-3">
        <div class="card p-3">
          <div class="metric">92%</div>
          <div class="subtext">Recomendación</div>
        </div>
      </div>
    </div>

    <!-- Gráficos -->
    <div class="row">
      <div class="col-md-6 mb-4">
        <div class="card p-3">
          <h5 class="card-title">Distribución de Calificaciones</h5>
          <canvas id="graficoCalificaciones"></canvas>
        </div>
      </div>
      <div class="col-md-6 mb-4">
        <div class="card p-3">
          <h5 class="card-title">Satisfacción por Turno</h5>
          <canvas id="graficoTurno"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Gráfico de calificaciones
    var ctx = document.getElementById('graficoCalificaciones').getContext('2d');
    var graficoCalificaciones = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: {{ labels|tojson }},
        datasets: [{
          label: 'Calificaciones',
          data: {{ valores|tojson }},
          backgroundColor: ['#007bff','#ffc107','#28a745','#dc3545','#6c757d']
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: true, position: 'top' } }
      }
    });

    // Gráfico por turno (ejemplo estático)
    var ctx2 = document.getElementById('graficoTurno').getContext('2d');
    var graficoTurno = new Chart(ctx2, {
      type: 'pie',
      data: {
        labels: ['Mañana','Tarde','Noche'],
        datasets: [{
          data: [45, 32, 20],
          backgroundColor: ['#007bff','#ffc107','#28a745']
        }]
      },
      options: { responsive: true }
    });
  </script>
</body>
</html>
