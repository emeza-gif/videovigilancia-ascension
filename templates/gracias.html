<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Gracias por su Opinión! - Centro de Videovigilancia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #001f5c 0%, #002b7f 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .main-container {
      max-width: 460px;
      width: 100%;
      padding: 15px;
    }
    .card-modern {
      background: #ffffff;
      color: #002b7f;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: none;
      overflow: hidden;
      text-align: center;
      padding: 30px 25px;
    }
    .success-icon-box {
      width: 80px;
      height: 80px;
      background-color: rgba(25, 135, 84, 0.1);
      color: #198754;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 15px rgba(25, 135, 84, 0.15);
    }
    .card-modern h3 {
      font-weight: 900;
      color: #002b7f;
      font-size: 1.6rem;
      margin-bottom: 12px;
    }
    .card-modern p {
      color: #4a5568;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .btn-action {
      background-color: #002b7f;
      color: #ffffff;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      padding: 14px;
      width: 100%;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      box-shadow: 0 6px 15px rgba(0, 43, 127, 0.3);
      transition: all 0.25s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 20px;
    }
    .btn-action:hover {
      background-color: #001f5c;
      color: #ffcc00;
      transform: translateY(-2px);
    }
    .emergency-box {
      background: #f8f9fa;
      border: 2px dashed #ffcc00;
      border-radius: 16px;
      padding: 15px;
      margin-top: 10px;
    }
    .emergency-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: #002b7f;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .btn-serenazgo {
      background-color: #001f5c;
      color: #ffcc00;
      font-weight: 800;
      border: 2px solid #ffcc00;
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      box-shadow: 0 4px 12px rgba(0, 31, 92, 0.2);
      transition: all 0.25s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }
    .btn-serenazgo:hover {
      background-color: #001233;
      color: #ffdd33;
      transform: translateY(-2px);
    }
    .footer-info {
      margin-top: 15px;
      font-size: 0.72rem;
      color: #a0aec0;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="card card-modern">
      
      <!-- Icono de éxito moderno -->
      <div class="success-icon-box">
        <i class="fa-solid fa-circle-check"></i>
      </div>

      <h3>¡Muchas Gracias!</h3>
      <p>Su opinión ha sido registrada exitosamente. Esto nos ayuda a mejorar continuamente la atención y el profesionalismo en el Centro de Videovigilancia.</p>

      <!-- Botón para volver al inicio -->
      <a href="/" class="btn btn-action">
        <i class="fa-solid fa-house"></i> Volver al Inicio <i class="fa-solid fa-chevron-right fs-6"></i>
      </a>

      <!-- Bloque formal y moderno para emergencias y reportes -->
      <div class="emergency-box">
        <div class="emergency-title">
          <i class="fa-solid fa-triangle-exclamation text-warning me-1"></i> ¿Algún reporte o emergencia?
        </div>
        <a href="tel:959499459" class="btn btn-serenazgo">
          <i class="fa-solid fa-phone-volume"></i> 959 499 459
        </a>
      </div>

    </div>

    <div class="footer-info">
      <span><i class="fa-solid fa-location-dot"></i> Centro de Videovigilancia - Ascensión, Huancavelica</span>
    </div>
  </div>

</body>
</html>
